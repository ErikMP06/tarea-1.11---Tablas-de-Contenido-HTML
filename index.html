<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <!-- Los estilos visuales y bordes se definen en CSS externo y no con atributos obsoletos como border, align o bgcolor para separar la estructura (HTML) del diseño y presentación (CSS). -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- La etiqueta <table> define una tabla HTML para mostrar datos tabulares. -->
    <table>
        <!-- La etiqueta <caption> sirve para añadir un título o leyenda descriptiva a la tabla. -->
        <caption>Horario de 1º DAW</caption>
    </table>

</body>
</html>
